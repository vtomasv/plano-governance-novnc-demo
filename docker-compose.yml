name: plano-governance-demo

x-python-service: &python-service
  restart: unless-stopped
  networks:
    - control
  security_opt:
    - no-new-privileges:true
  read_only: true
  tmpfs:
    - /tmp:size=64m,mode=1777

x-desktop: &desktop
  build:
    context: ./desktop
    args:
      NOVNC_VERSION: v1.7.0
      WEBSOCKIFY_VERSION: 0.13.0
  restart: unless-stopped
  depends_on:
    cert-init:
      condition: service_completed_successfully
    proxy-interceptor:
      condition: service_healthy
    governed-agent:
      condition: service_healthy
  environment:
    VNC_PASSWORD: ${VNC_PASSWORD:-plano-demo}
    PROXY_URL: http://proxy-interceptor:8080
    CA_FILE: /certs/plano-demo-root-ca.crt
  volumes:
    - demo-certs:/certs:ro
  networks:
    - control
  shm_size: 1gb
  security_opt:
    - no-new-privileges:true

services:
  cert-init:
    build:
      context: .
      dockerfile: cert-init/Dockerfile
    environment:
      FORCE_CA_REGEN: ${FORCE_CA_REGEN:-0}
    volumes:
      - demo-certs:/certs
    network_mode: none
    restart: "no"

  control-center:
    <<: *python-service
    hostname: control-center
    build:
      context: ./control-center
    environment:
      BIND_ADDRESS: ${BIND_ADDRESS:-127.0.0.1}
      POLICY_FAIL_MODE: ${POLICY_FAIL_MODE:-closed}
      LOG_PROMPT_BODIES: ${LOG_PROMPT_BODIES:-false}
      CHATGPT_NOVNC_PORT: ${CHATGPT_NOVNC_PORT:-6080}
      CLAUDE_NOVNC_PORT: ${CLAUDE_NOVNC_PORT:-6081}
      GROK_NOVNC_PORT: ${GROK_NOVNC_PORT:-6082}
      GEMINI_NOVNC_PORT: ${GEMINI_NOVNC_PORT:-6083}
      AUDIT_DASHBOARD_PORT: ${AUDIT_DASHBOARD_PORT:-10700}
      PLANO_PORT: ${PLANO_PORT:-12000}
      PLANO_ADMIN_PORT: ${PLANO_ADMIN_PORT:-19901}
      POLICY_GUARD_PORT: ${POLICY_GUARD_PORT:-10500}
      PROVIDER_SIM_PORT: ${PROVIDER_SIM_PORT:-10501}
      GOVERNED_AGENT_PORT: ${GOVERNED_AGENT_PORT:-10600}
      JAEGER_UI_PORT: ${JAEGER_UI_PORT:-16686}
      MITMPROXY_UI_PORT: ${MITMPROXY_UI_PORT:-8081}
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${CONTROL_CENTER_PORT:-10000}:10000"

  audit-dashboard:
    <<: *python-service
    hostname: audit-dashboard
    build:
      context: ./audit-dashboard
    environment:
      AUDIT_DASHBOARD_USER: ${AUDIT_DASHBOARD_USER:-admin}
      AUDIT_DASHBOARD_PASSWORD: ${AUDIT_DASHBOARD_PASSWORD:-plano-demo}
      AUDIT_INGEST_TOKEN: ${AUDIT_INGEST_TOKEN:-plano-audit-ingest-demo}
      AUDIT_RETENTION_DAYS: ${AUDIT_RETENTION_DAYS:-7}
      AUDIT_MAX_EVENTS: ${AUDIT_MAX_EVENTS:-10000}
    volumes:
      - audit-data:/data
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${AUDIT_DASHBOARD_PORT:-10700}:10700"

  policy-guard:
    <<: *python-service
    hostname: policy-guard
    build:
      context: ./policy-guard
    depends_on:
      audit-dashboard:
        condition: service_healthy
    environment:
      LOG_PROMPT_BODIES: ${LOG_PROMPT_BODIES:-false}
      AUDIT_URL: http://audit-dashboard:10700/ingest
      AUDIT_INGEST_TOKEN: ${AUDIT_INGEST_TOKEN:-plano-audit-ingest-demo}
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${POLICY_GUARD_PORT:-10500}:10500"

  provider-sim:
    <<: *python-service
    hostname: provider-sim
    build:
      context: ./provider-sim
    depends_on:
      audit-dashboard:
        condition: service_healthy
    environment:
      AUDIT_URL: http://audit-dashboard:10700/ingest
      AUDIT_INGEST_TOKEN: ${AUDIT_INGEST_TOKEN:-plano-audit-ingest-demo}
    networks:
      - control
      - upstream-sim
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${PROVIDER_SIM_PORT:-10501}:10501"

  provider-web-sim:
    image: nginx:1.28.0-alpine
    restart: unless-stopped
    depends_on:
      cert-init:
        condition: service_completed_successfully
      provider-sim:
        condition: service_healthy
    volumes:
      - ./provider-sim/nginx.conf:/etc/nginx/nginx.conf:ro
      - demo-certs:/certs:ro
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${PROVIDER_TLS_PORT:-18443}:8443"
    networks:
      upstream-sim:
        aliases:
          - chatgpt.demo.local
          - claude.demo.local
          - grok.demo.local
          - gemini.demo.local
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /var/cache/nginx:size=16m
      - /var/run:size=4m
      - /tmp:size=16m
    healthcheck:
      test: ["CMD", "curl", "-fk", "https://127.0.0.1:8443/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 5s

  jaeger:
    image: jaegertracing/all-in-one:1.68.0
    restart: unless-stopped
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${JAEGER_UI_PORT:-16686}:16686"
      - "${BIND_ADDRESS:-127.0.0.1}:${OTLP_GRPC_PORT:-4317}:4317"
      - "${BIND_ADDRESS:-127.0.0.1}:${OTLP_HTTP_PORT:-4318}:4318"
    networks:
      - control
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:16686/"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 5s

  plano:
    image: plano-governance-demo/plano:0.4.36
    build:
      context: ./plano
    restart: unless-stopped
    depends_on:
      policy-guard:
        condition: service_healthy
      provider-sim:
        condition: service_healthy
      jaeger:
        condition: service_started
    volumes:
      - ./plano/config.local.yaml:/app/plano_config.yaml:ro
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${PLANO_PORT:-12000}:12000"
      - "${BIND_ADDRESS:-127.0.0.1}:${PLANO_AGENT_PORT:-8001}:8001"
      - "${BIND_ADDRESS:-127.0.0.1}:${PLANO_ADMIN_PORT:-19901}:9901"
    networks:
      - control
      - egress
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "/app/.venv/bin/python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:12000/healthz', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 15s

  governed-agent:
    <<: *python-service
    build:
      context: ./governed-agent
    restart: unless-stopped
    depends_on:
      plano:
        condition: service_healthy
      audit-dashboard:
        condition: service_healthy
    environment:
      PLANO_BASE_URL: http://plano:12000
      AUDIT_URL: http://audit-dashboard:10700/ingest
      AUDIT_INGEST_TOKEN: ${AUDIT_INGEST_TOKEN:-plano-audit-ingest-demo}
      MAX_PROMPT_CHARS: 12000
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${GOVERNED_AGENT_PORT:-10600}:10600"

  proxy-interceptor:
    build:
      context: ./proxy-interceptor
    restart: unless-stopped
    depends_on:
      cert-init:
        condition: service_completed_successfully
      plano:
        condition: service_healthy
      audit-dashboard:
        condition: service_healthy
    environment:
      PLANO_POLICY_URL: http://plano:12000/v1/chat/completions
      POLICY_FAIL_MODE: ${POLICY_FAIL_MODE:-closed}
      MITMWEB_PASSWORD: ${MITMWEB_PASSWORD:-plano-demo}
      AUDIT_BASE_URL: http://audit-dashboard:10700
      AUDIT_INGEST_TOKEN: ${AUDIT_INGEST_TOKEN:-plano-audit-ingest-demo}
      GOVERNED_HOSTS: chatgpt.com,chat.openai.com,api.openai.com,claude.ai,api.anthropic.com,grok.com,x.com,api.x.ai,gemini.google.com,bard.google.com,generativelanguage.googleapis.com,chatgpt.demo.local,claude.demo.local,grok.demo.local,gemini.demo.local
      MAX_INSPECTION_BODY_BYTES: 2097152
    volumes:
      - demo-certs:/certs:ro
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${MITMPROXY_UI_PORT:-8081}:8081"
    networks:
      - control
      - upstream-sim
      - egress
    security_opt:
      - no-new-privileges:true

  desktop-chatgpt:
    <<: *desktop
    hostname: desktop-chatgpt
    environment:
      PROVIDER: chatgpt
      VNC_PASSWORD: ${VNC_PASSWORD:-plano-demo}
      PROXY_URL: http://proxy-interceptor:8080
      CA_FILE: /certs/plano-demo-root-ca.crt
    volumes:
      - demo-certs:/certs:ro
      - chatgpt-profile:/home/demo/.config/chromium
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${CHATGPT_NOVNC_PORT:-6080}:6080"

  desktop-claude:
    <<: *desktop
    hostname: desktop-claude
    environment:
      PROVIDER: claude
      VNC_PASSWORD: ${VNC_PASSWORD:-plano-demo}
      PROXY_URL: http://proxy-interceptor:8080
      CA_FILE: /certs/plano-demo-root-ca.crt
    volumes:
      - demo-certs:/certs:ro
      - claude-profile:/home/demo/.config/chromium
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${CLAUDE_NOVNC_PORT:-6081}:6080"

  desktop-grok:
    <<: *desktop
    hostname: desktop-grok
    environment:
      PROVIDER: grok
      VNC_PASSWORD: ${VNC_PASSWORD:-plano-demo}
      PROXY_URL: http://proxy-interceptor:8080
      CA_FILE: /certs/plano-demo-root-ca.crt
    volumes:
      - demo-certs:/certs:ro
      - grok-profile:/home/demo/.config/chromium
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${GROK_NOVNC_PORT:-6082}:6080"

  desktop-gemini:
    <<: *desktop
    hostname: desktop-gemini
    environment:
      PROVIDER: gemini
      VNC_PASSWORD: ${VNC_PASSWORD:-plano-demo}
      PROXY_URL: http://proxy-interceptor:8080
      CA_FILE: /certs/plano-demo-root-ca.crt
    volumes:
      - demo-certs:/certs:ro
      - gemini-profile:/home/demo/.config/chromium
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${GEMINI_NOVNC_PORT:-6083}:6080"

networks:
  control:
    internal: true
  upstream-sim:
    internal: true
  egress:

volumes:
  demo-certs:
  chatgpt-profile:
  claude-profile:
  grok-profile:
  gemini-profile:
  audit-data:
