global
    log stdout format raw local0
    maxconn 4096
    dns-accept-family ipv4

defaults
    log global
    mode tcp
    option tcplog
    timeout connect 5s
    timeout client 1h
    timeout server 1h

resolvers docker
    nameserver docker_dns 127.0.0.11:53
    accepted_payload_size 8192
    resolve_retries 3
    timeout resolve 1s
    timeout retry 1s
    hold valid 10s
    hold other 10s
    hold refused 10s
    hold nx 10s
    hold timeout 10s
    hold obsolete 10s

listen publisher_stats
    mode http
    bind 0.0.0.0:8404
    stats enable
    stats uri /
    stats refresh 5s

listen control_center
    bind 0.0.0.0:10000
    server control-center control-center:10000 check resolvers docker init-addr last,libc,none resolve-prefer ipv4

listen chatgpt_novnc
    bind 0.0.0.0:6080
    server desktop-chatgpt desktop-chatgpt:6080 check resolvers docker init-addr last,libc,none resolve-prefer ipv4

listen claude_novnc
    bind 0.0.0.0:6081
    server desktop-claude desktop-claude:6080 check resolvers docker init-addr last,libc,none resolve-prefer ipv4

listen grok_novnc
    bind 0.0.0.0:6082
    server desktop-grok desktop-grok:6080 check resolvers docker init-addr last,libc,none resolve-prefer ipv4

listen plano_gateway
    bind 0.0.0.0:12000
    server plano plano:12000 check resolvers docker init-addr last,libc,none resolve-prefer ipv4

listen plano_agent
    bind 0.0.0.0:8001
    server plano plano:8001 check resolvers docker init-addr last,libc,none resolve-prefer ipv4

listen plano_admin
    bind 0.0.0.0:19901
    server plano plano:9901 check resolvers docker init-addr last,libc,none resolve-prefer ipv4

listen policy_guard
    bind 0.0.0.0:10500
    server policy-guard policy-guard:10500 check resolvers docker init-addr last,libc,none resolve-prefer ipv4

listen provider_sim
    bind 0.0.0.0:10501
    server provider-sim provider-sim:10501 check resolvers docker init-addr last,libc,none resolve-prefer ipv4

listen provider_tls
    bind 0.0.0.0:18443
    server provider-web-sim provider-web-sim:8443 check resolvers docker init-addr last,libc,none resolve-prefer ipv4

listen governed_agent
    bind 0.0.0.0:10600
    server governed-agent governed-agent:10600 check resolvers docker init-addr last,libc,none resolve-prefer ipv4

listen jaeger_ui
    bind 0.0.0.0:16686
    server jaeger jaeger:16686 check resolvers docker init-addr last,libc,none resolve-prefer ipv4

listen otlp_grpc
    bind 0.0.0.0:4317
    server jaeger jaeger:4317 check resolvers docker init-addr last,libc,none resolve-prefer ipv4

listen otlp_http
    bind 0.0.0.0:4318
    server jaeger jaeger:4318 check resolvers docker init-addr last,libc,none resolve-prefer ipv4

listen mitmweb
    bind 0.0.0.0:8081
    server proxy-interceptor proxy-interceptor:8081 check resolvers docker init-addr last,libc,none resolve-prefer ipv4
