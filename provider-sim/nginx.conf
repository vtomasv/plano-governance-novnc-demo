events {}

http {
  access_log /var/log/nginx/access.log;
  error_log /var/log/nginx/error.log warn;

  server {
    listen 8443 ssl;
    server_name chatgpt.demo.local claude.demo.local grok.demo.local gemini.demo.local;

    ssl_certificate /certs/demo-upstream.crt;
    ssl_certificate_key /certs/demo-upstream.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    location / {
      proxy_pass http://provider-sim:10501;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Demo-Upstream true;
      proxy_http_version 1.1;
      proxy_buffering off;
    }
  }
}
